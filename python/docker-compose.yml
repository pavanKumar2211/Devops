version: '3.8'

services:
  backend-app:
    build:
      context: backend
      dockerfile: ./backend.Dockerfile
    ports:
      - "8000:8080"
    environment:
      Database_Url: ${Database_Url}

  postgres-db:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}